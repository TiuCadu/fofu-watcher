<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="optionsDocTitle">Fofu Watcher</title>
  <link rel="stylesheet" href="../styles/base.css">
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <main>
    <header class="row">
      <h1>Fofu Watcher</h1>
      <span class="spacer"></span>
      <nav class="row">
        <button class="tab" data-tab="sites" data-i18n="tabSites"></button>
        <button class="tab" data-tab="history" data-i18n="tabHistory"></button>
        <button class="tab" data-tab="settings" data-i18n="tabSettings"></button>
      </nav>
    </header>

    <section id="tab-sites">
      <div class="row" style="margin-bottom:12px">
        <h2 data-i18n="sitesTitle"></h2><span class="spacer"></span>
        <button id="btn-new" class="primary" data-i18n="addSite"></button>
      </div>
      <div id="sites"></div>
    </section>

    <section id="tab-history" class="hidden">
      <div class="row" style="margin-bottom:12px">
        <h2 data-i18n="historyTitle"></h2><span class="spacer"></span>
        <select id="hist-site" data-i18n-aria-label="siteAria"></select>
      </div>
      <div class="muted" style="margin-bottom:8px" data-i18n="historyHint"></div>
      <div id="hist"></div>
    </section>

    <section id="tab-settings" class="hidden">
      <h2 style="margin-bottom:12px" data-i18n="settingsTitle"></h2>
      <div class="card stack">
        <label>
          <span data-i18n="settingLanguage"></span>
          <select id="s-lang">
            <option value="auto" data-i18n="langAuto"></option>
            <option value="pt-BR" data-i18n="langPt"></option>
            <option value="en-US" data-i18n="langEn"></option>
          </select>
        </label>
        <label>
          <span data-i18n="settingHourFormat"></span>
          <select id="s-hour">
            <option value="auto" data-i18n="hourAuto"></option>
            <option value="24" data-i18n="hour24"></option>
            <option value="12" data-i18n="hour12"></option>
          </select>
        </label>
        <label class="row"><input type="checkbox" id="s-sound"> <span data-i18n="settingSound"></span></label>
        <div class="row wrap">
          <label class="row"><input type="checkbox" id="s-dnd"> <span data-i18n="settingDnd"></span></label>
          <span id="s-dnd-start" class="tp-host"></span>
          <span data-i18n="and"></span>
          <span id="s-dnd-end" class="tp-host"></span>
        </div>
        <div class="muted" data-i18n="settingDndHint"></div>
      </div>
      <h3 style="margin:18px 0 8px" data-i18n="backupTitle"></h3>
      <div class="card stack">
        <div class="row wrap">
          <button id="btn-export" data-i18n="btnExport"></button>
          <button id="btn-import" data-i18n="btnImport"></button>
          <input type="file" id="file-import" accept="application/json,.json" class="hidden">
          <button id="btn-grant" data-i18n="btnGrant"></button>
        </div>
        <div class="muted" data-i18n="backupHint"></div>
        <div id="settings-msg" class="muted" role="status"></div>
      </div>
    </section>
  </main>

  <dialog id="dlg">
    <form id="form" novalidate>
      <h2 id="dlg-title"></h2>
      <div class="stack">
        <label><span data-i18n="fUrl"></span>
          <input type="url" id="f-url" placeholder="https://example.com/page" required></label>
        <label><span data-i18n="fName"></span>
          <input type="text" id="f-name" data-i18n-placeholder="fNamePh"></label>
        <label><span data-i18n="fSelector"></span>
          <input type="text" id="f-selector" data-i18n-placeholder="fSelectorPh"></label>
        <label class="row"><input type="checkbox" id="f-ignore" checked>
          <span data-i18n="fIgnore"></span></label>

        <fieldset>
          <legend data-i18n="fSchedule"></legend>
          <div class="row">
            <label class="row"><input type="radio" name="mode" value="fixed" checked> <span data-i18n="modeFixed"></span></label>
            <label class="row"><input type="radio" name="mode" value="interval"> <span data-i18n="modeInterval"></span></label>
          </div>

          <div id="mode-fixed" class="stack" style="margin-top:10px">
            <div class="row"><span id="f-time" class="tp-host"></span><button type="button" id="btn-add-time" data-i18n="addTime"></button></div>
            <div id="chips" class="row wrap"></div>
            <div class="row wrap" id="days">
              <span class="muted" data-i18n="daysLabel"></span>
            </div>
            <div class="muted" data-i18n="daysHint"></div>
          </div>

          <div id="mode-interval" class="stack hidden" style="margin-top:10px">
            <div class="row"><span data-i18n="everyLabel"></span>
              <input type="number" id="f-every" min="1" value="30" style="width:80px">
              <select id="f-unit"><option value="1" data-i18n="unitMinutes"></option><option value="60" data-i18n="unitHours"></option></select></div>
            <div class="row wrap">
              <label class="row"><input type="checkbox" id="f-window"> <span data-i18n="windowOnly"></span></label>
              <span id="f-ws" class="tp-host"></span> <span data-i18n="and"></span> <span id="f-we" class="tp-host"></span>
            </div>
          </div>
        </fieldset>

        <div id="preview" class="card muted" role="status"></div>
        <div id="form-error" class="error-text" role="alert"></div>
        <div class="row">
          <span class="spacer"></span>
          <button type="button" id="btn-cancel" data-i18n="cancel"></button>
          <button type="submit" class="primary" data-i18n="save"></button>
        </div>
      </div>
    </form>
  </dialog>
  <script src="options.js"></script>
</body>
</html>
